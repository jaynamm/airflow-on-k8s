kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
    - containerPort: 30080  # NodePort
      hostPort: 30080
      protocol: TCP
  # IMPORTANT: Update the hostPath values below to match your local directory structure
  # Replace <ABSOLUTE_PATH_TO_PROJECT> with the full path to this project directory
  # Example (macOS): /Users/yourname/workspace/airflow-on-k8s
  # Example (Linux): /home/yourname/workspace/airflow-on-k8s
  extraMounts:
    - hostPath: <ABSOLUTE_PATH_TO_PROJECT>/dags
      containerPath: /mnt/airflow-dags
      readOnly: false
    - hostPath: <ABSOLUTE_PATH_TO_PROJECT>/apps
      containerPath: /mnt/airflow-apps
      readOnly: false
- role: worker
  extraMounts:
    - hostPath: <ABSOLUTE_PATH_TO_PROJECT>/dags
      containerPath: /mnt/airflow-dags
      readOnly: false
    - hostPath: <ABSOLUTE_PATH_TO_PROJECT>/apps
      containerPath: /mnt/airflow-apps
      readOnly: false
- role: worker
  extraMounts:
    - hostPath: <ABSOLUTE_PATH_TO_PROJECT>/dags
      containerPath: /mnt/airflow-dags
      readOnly: false
    - hostPath: <ABSOLUTE_PATH_TO_PROJECT>/apps
      containerPath: /mnt/airflow-apps
      readOnly: false